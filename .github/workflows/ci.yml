name: CI

on:
  pull_request:
  push:
    branches:
      - agent/cv-pdf-alignment-injection-lab

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-output
          path: test-output.txt
          if-no-files-found: error

      - name: Production build
        if: success()
        run: npm run build
