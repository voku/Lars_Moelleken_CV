name: CI

on:
  pull_request:
  push:
    branches:
      - agent/cv-pdf-alignment-injection-lab

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run lint

      - name: Trust-boundary tests
        run: npx vitest run src/trust.test.ts

      - name: Public-profile tests
        run: npx vitest run src/webmcp/profileTools.test.ts

      - name: Component tests
        run: npx vitest run src/components/cv

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build
